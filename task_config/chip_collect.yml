save_dir: ./data

decimation: 1

save_frequency: 2
video_frequency: 2
render_frequency: 0   # headless 采集

random_texture: false

use_seed: true
episode_num: 100      # 采 100 条成功数据
start_seed: -1        # -1 = auto-resume from suc_map.txt
max_seed: -1          # 抓取偶有失败, 不限 seed 直到凑够 100 条

sensor_type: gsmini

observations:
  camera: ['rgb']
  tactile: ['rgb', 'rgb_marker', 'marker', 'depth', 'pose']
  embodiment: ['joint', 'ee']
  actor: true
